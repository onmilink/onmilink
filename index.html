<!DOCTYPE html>
<html lang="es">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONMI Link — Reportings Paid Media</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#111;
      --muted:#77736b;
      --soft:#f4f2ee;
      --paper:#fff;
      --line:#dedad2;
      --line-dark:#c8c2b7;
    }
    body{
      font-family:'DM Sans',sans-serif;
      background:var(--soft);
      color:var(--ink);
      min-height:100vh;
      padding:48px 24px;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{max-width:760px;width:100%;margin:0 auto}
    .header{padding-top:18px;margin-bottom:34px}
    .label{
      font-family:'DM Mono',monospace;
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:12px;
    }
    h1{font-size:clamp(28px,5vw,38px);line-height:1.05;font-weight:300;margin-bottom:10px}
    .intro{color:var(--muted);font-size:15px;line-height:1.55;max-width:520px}
    .section{margin-top:28px}
    .section-title{
      font-family:'DM Mono',monospace;
      font-size:10px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
      padding-bottom:10px;
      border-bottom:1px solid var(--line);
      margin-bottom:10px;
    }
    ul{list-style:none;display:grid;gap:8px}
    a{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:15px 18px;
      border:1px solid rgba(0,0,0,.09);
      border-radius:4px;
      background:var(--paper);
      color:var(--ink);
      text-decoration:none;
      font-size:14px;
      line-height:1.3;
      transition:background .15s,border-color .15s,transform .15s;
    }
    a > span:first-child{min-width:0}
    a:hover{background:#ebe8e1;border-color:var(--line-dark);transform:translateY(-1px)}
    .meta{
      font-family:'DM Mono',monospace;
      font-size:9px;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--muted);
      white-space:nowrap;
      text-align:right;
    }
    .disabled{
      color:#9c978d;
      background:#f8f7f4;
      cursor:default;
    }
    .disabled:hover{background:#f8f7f4;border-color:rgba(0,0,0,.09);transform:none}
    @media (max-width:560px){
      body{padding:24px 14px 32px}
      .header{padding:8px 2px 0;margin-bottom:28px}
      .label{font-size:8px;letter-spacing:.12em;margin-bottom:10px}
      h1{font-size:31px;line-height:1.02;max-width:8em}
      .intro{font-size:14px;line-height:1.45;max-width:28em}
      .section{margin-top:24px}
      .section-title{font-size:9px;margin-bottom:8px;padding-bottom:8px}
      ul{gap:7px}
      a{
        grid-template-columns:minmax(0,1fr);
        gap:8px;
        padding:14px 14px 13px;
        min-height:72px;
        font-size:15px;
        align-content:center;
      }
      a:hover{transform:none}
      .meta{
        width:max-content;
        max-width:100%;
        padding:4px 7px;
        border:1px solid var(--line);
        border-radius:999px;
        background:#f8f7f4;
        white-space:normal;
        text-align:left;
        line-height:1.15;
      }
    }
    @media (max-width:360px){
      body{padding-left:10px;padding-right:10px}
      h1{font-size:29px}
      a{padding-left:12px;padding-right:12px;font-size:14px}
      .intro{font-size:13.5px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="label">ONMI Link · Paid Media</div>
      <h1>Reportings Paid Media</h1>
      <p class="intro">Informes de Paid Media de ONMI Link.</p>
    </header>

    <section class="section">
      <p class="intro">Si has recibido un enlace a tu informe, ábrelo directamente desde ese enlace.</p>
    </section>
  </main>
</body>
</html>
